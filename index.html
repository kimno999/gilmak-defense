<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dragon Merge &amp; Maze</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="app">
  <header class="top">
    <div class="brand">
      <h1>Dragon Merge &amp; Maze</h1>
      <p class="sub" id="phaseLine">드래곤으로 미로를 만들어 몬스터를 막으세요</p>
    </div>
    <div class="hud" aria-live="polite">
      <div class="stat"><span class="k">라운드</span><span class="v" id="hRound">1-1</span></div>
      <div class="stat"><span class="k">골드</span><span class="v gold" id="hGold">0</span></div>
      <div class="stat"><span class="k">생명</span><span class="v life" id="hLives">20</span></div>
      <div class="stat"><span class="k">경로</span><span class="v" id="hPath">0칸</span></div>
    </div>
    <div class="topbtns">
      <button class="btn small" type="button" id="btnBook">조합 도감<span class="badge" id="bookBadge" hidden></span></button>
      <button class="btn small" type="button" id="btnHelp">도움말</button>
      <button class="btn small" type="button" id="btnSound" aria-pressed="true">소리 켜짐</button>
      <button class="btn small" type="button" id="btnMenu">메뉴</button>
    </div>
  </header>

  <main class="stage">
    <section class="board">
      <div class="coach" id="coach" hidden aria-live="polite">
        <div class="coachHead"><span class="coachStep" id="coachStep"></span><b id="coachTitle"></b></div>
        <div class="coachText" id="coachText"></div>
        <div class="coachActs"><button class="btn small primary" type="button" id="coachNext" hidden></button><button class="btn small" type="button" id="coachQuit">튜토리얼 그만두기</button></div>
      </div>
      <div class="mapline"><span class="mapname" id="mapName"></span><span class="maptags" id="mapTags"></span></div>
      <div class="canvasWrap" id="wrap">
        <canvas id="cv" width="384" height="256" aria-label="전장 지도"></canvas>
        <div class="toast" id="toast" hidden></div>
        <div class="bubbles" id="bubbles"></div>
        <div class="mapActs" id="mapActs" hidden></div>
        <div class="luckStrip" id="luckStrip"></div>
        <div class="banner" id="banner" hidden><span class="bk" id="bannerKind"></span><span class="bt" id="bannerText"></span></div>
      </div>
      <div class="controls">
        <button class="btn primary grow" id="btnStart" type="button">웨이브 시작</button>
        <button class="btn" id="btnSpeed" type="button">속도 ×1</button>
        <button class="btn" id="btnPause" type="button">일시정지</button>
        <button class="btn" id="btnLight" type="button" aria-pressed="true">빛 효과 켜짐</button>
      </div>
      <div class="hint" id="hint" hidden>
        <p id="hintText"></p>
        <button class="btn small" type="button" id="hintClose">알겠어요</button>
      </div>
    </section>

    <aside class="side">
      <section class="panel" id="trayPanel">
        <h3 id="trayTitle">이번 라운드 드래곤</h3>
        <div class="tray" id="tray"></div>
      </section>
      <section class="panel" id="info"></section>
      <section class="panel" id="luckPanel"></section>
      <section class="panel" id="wavePanel"></section>
    </aside>
  </main>
</div>

<div class="modal" id="modal" hidden>
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <div class="sheethead">
      <h2 id="modalTitle"></h2>
      <button class="btn small" type="button" id="modalClose">닫기</button>
    </div>
    <div class="sheetbody" id="modalBody"></div>
    <div class="sheetfoot" id="modalFoot"></div>
  </div>
</div>

<script type="module" src="js/main.js"></script>
</body>
</html>
